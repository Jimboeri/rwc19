{% extends "arena/player/base.html" %}

{% block title %}Set new password{% endblock %}

{% block content %}
<h1>Set a new password</h1>
{% if validlink %}
  <div class="card">
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn">Reset password</button>
    </form>
  </div>
{% else %}
  <div class="card">
    <p>This link is no longer valid. <a href="{% url 'arena:password_reset' %}">Request a new one</a>.</p>
  </div>
{% endif %}
{% endblock %}
