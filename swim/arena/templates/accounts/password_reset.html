{% extends "arena/player/base.html" %}

{% block title %}Reset password{% endblock %}

{% block content %}
<h1>Reset your password</h1>
<div class="card">
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn">Send reset link</button>
  </form>
</div>
<p><a href="{% url 'arena:signup' %}">Sign up</a> / <a href="{% url 'arena:login' %}">Login</a></p>
{% endblock %}
